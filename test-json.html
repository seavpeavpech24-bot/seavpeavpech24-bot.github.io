<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test JSON Loading</title>
</head>
<body>
    <h1>Testing JSON Loading</h1>
    <div id="result"></div>
    
    <script>
        async function testJsonLoading() {
            try {
                console.log('Attempting to load projects-data.json...');
                const response = await fetch('projects-data.json');
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('JSON data loaded:', data);
                
                document.getElementById('result').innerHTML = `
                    <h2>Success!</h2>
                    <p>Found ${data.projects.length} projects:</p>
                    <ul>
                        ${data.projects.map(p => `<li>${p.id}: ${p.title}</li>`).join('')}
                    </ul>
                `;
            } catch (error) {
                console.error('Error loading JSON:', error);
                document.getElementById('result').innerHTML = `
                    <h2>Error!</h2>
                    <p>${error.message}</p>
                `;
            }
        }
        
        testJsonLoading();
    </script>
</body>
</html>
